name: Addon health

# Revisa una vez al día que los complementos que instala el wizard respondan.
# Si alguno falla dos veces seguidas (con 3 minutos de diferencia), abre o actualiza un issue;
# cuando todos vuelven a responder, lo cierra.
on:
  schedule:
    - cron: "17 11 * * *"   # 08:17 en Chile (verano)
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: addon-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check addons and update issue
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = 'https://wizard.stremio-nuvio.workers.dev/api/addon-health';
            const fetchHealth = async () => {
              const res = await fetch(endpoint + '?t=' + Date.now(), { headers: { 'cache-control': 'no-cache' } });
              if (!res.ok) throw new Error('Wizard health endpoint returned HTTP ' + res.status);
              return res.json();
            };
            let first;
            try { first = await fetchHealth(); }
            catch (e) { first = { ok: false, failing: ['wizard'], results: [{ key: 'wizard', name: 'Wizard itself', host: 'wizard.stremio-nuvio.workers.dev', ok: false, error: e.message }] }; }

            let confirmed = first;
            if (!first.ok) {
              await new Promise(r => setTimeout(r, 180000));
              let second;
              try { second = await fetchHealth(); } catch (e) { second = first; }
              const stillFailing = new Set(second.failing || []);
              confirmed = { ...second, failing: (first.failing || []).filter(k => stillFailing.has(k)) };
              confirmed.ok = confirmed.failing.length === 0;
            }

            const title = '[Monitor] Addon health';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'addon-down', per_page: 50
            });
            const existing = open.find(i => i.title === title);
            const rows = (confirmed.results || []).map(r =>
              `| ${r.ok ? '✅' : '❌'} | ${r.name} | \`${r.host}\` | ${r.ok ? '' : (r.error || '')} |`).join('\n');
            const table = `| | Addon | Host | Error |\n|---|---|---|---|\n${rows}`;

            if (!confirmed.ok) {
              const names = (confirmed.results || []).filter(r => confirmed.failing.includes(r.key)).map(r => r.name).join(', ');
              const body = `@${context.repo.owner} the daily check found addons that are not responding (failed twice, 3 minutes apart): **${names}**.\n\nChecked at ${new Date().toISOString()}.\n\n${table}\n\nThis issue closes automatically when everything responds again.`;
              if (existing) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['addon-down'] });
              }
              core.warning('Failing: ' + names);
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: `All addons are responding again (${new Date().toISOString()}). Closing.\n\n${table}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            } else {
              core.info('All addons OK');
            }
